<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Thiệp cưới Ngọc Thành &amp; Vân Anh · Nhà Trai</title>
<meta name="description" content="Trân trọng kính mời bạn đến dự tiệc cưới Ngọc Thành &amp; Vân Anh · 28.11.2026">
<meta property="og:title" content="Thiệp cưới Ngọc Thành &amp; Vân Anh">
<meta property="og:image" content="photos/hero.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=WindSong:wght@400;500&family=Pinyon+Script&family=Noto+Serif+Display:ital,wght@0,300;0,400;0,500;1,300&display=swap">
<style>
:root{
  color-scheme: light;
  --gold:#906D38; --gold-dk:#755525; --gold-lt:#C9A874;
  --rose:#A07B7B; --blush:#F4E1E3; --petal:#E9C9CE;
  --cream:#FFFBFA; --paper:#FFFFFF; --ink:#5E4A2E; --muted:#8E7B63; --line:#DDD3C8; --backdrop:#EFE7E3;
  --script:"WindSong","Brush Script MT",cursive;
  --serif:"Noto Serif Display","Times New Roman",Georgia,serif;
  --ui:var(--serif);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--backdrop);color:var(--gold);font-family:var(--serif);font-size:17px;font-weight:300;line-height:1.5;-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
img{display:block;max-width:100%}
.card{max-width:460px;margin:0 auto;background:var(--cream);position:relative;overflow:hidden;box-shadow:0 0 50px rgba(90,70,48,.18)}
.flora{position:absolute;pointer-events:none;color:#E2C3C8;opacity:.85;z-index:0}
.flora svg{width:100%;height:100%;overflow:visible}
.wash{position:absolute;pointer-events:none;border-radius:50%;filter:blur(34px);background:var(--blush);opacity:.6;z-index:0}

/* ---------- cover ---------- */
.cover{position:fixed;inset:0;z-index:100;background:var(--cream);overflow:hidden;transition:opacity .9s ease,transform .9s ease,visibility .9s}
.cover.fade{opacity:0;visibility:hidden;transform:translateY(-4%)}
.cover-in{position:relative;z-index:1;height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;align-items:center;padding:7vh 16px 0}
.cover-names{text-align:center;margin:0;font-weight:400;color:var(--gold)}
.cover-names .n{display:block;font-family:var(--script);font-size:clamp(36px,11.2vw,50px);line-height:1.35;font-weight:500;white-space:nowrap}
.cover-names .a{display:block;line-height:1}
.cover-date{font-size:24px;letter-spacing:.06em;margin:10px 0 0;font-weight:300}
.env-wrap{margin:auto 0;width:100%;display:flex;flex-direction:column;align-items:center;padding:14px 0}
.env{position:relative;width:min(320px,82vw);aspect-ratio:300/200;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.env svg.es{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.es .flap{transform-origin:0 14px;transition:transform .7s ease}
.es .lt{transition:transform .9s ease .45s}
.cover.opening .es .flap{transform:scaleY(-1)}
.cover.opening .es .lt{transform:translateY(-70px)}
.seal{position:absolute;left:50%;top:56%;width:20%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;display:grid;place-items:center;color:#F9E9DF;font-family:var(--script);font-size:clamp(17px,5.4vw,22px);line-height:1;background:radial-gradient(circle at 36% 30%,#DFA98F,#BE836A 52%,#94604A);box-shadow:0 3px 8px rgba(70,40,25,.35),inset 0 0 0 3px rgba(255,255,255,.14),inset 0 0 0 7px rgba(110,60,40,.18);transition:opacity .45s,transform .45s}
.hand{position:absolute;left:54%;top:63%;width:15%;pointer-events:none;filter:drop-shadow(0 1px 3px rgba(0,0,0,.35));animation:tap 1.6s ease-in-out infinite;transition:opacity .3s}
@keyframes tap{0%,100%{transform:translate(0,0)}50%{transform:translate(-6px,-8px)}}
.sealg{transform-box:fill-box;transform-origin:center;transition:opacity .45s,transform .45s}
.cover.opening .sealg{opacity:0;transform:scale(.5)}
.cover.opening .hand{opacity:0}
.tap{font-size:19px;font-weight:300;color:var(--gold);text-align:center;margin:18px 0 0}
.cover-bar{margin-top:auto;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center;font-family:var(--ui);color:var(--gold);padding:14px 4px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(0deg,rgba(253,249,248,.95) 70%,transparent)}
.cover-bar b{display:block;font-size:17px;font-weight:500}
.cover-bar span{display:block;font-size:14px}

/* ---------- invitation ---------- */
.sec{position:relative;padding:48px 24px}
.inv{padding-top:22px;text-align:center}
.inv>*:not(.flora):not(.wash){position:relative;z-index:1}
.fam{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center;font-family:var(--ui);color:var(--gold);font-size:15px;line-height:1.35;padding-bottom:6px}
.fam b{display:block;font-size:17px;font-weight:500;margin-bottom:2px}
.fam .pl{display:block;font-size:12.5px;opacity:.8;margin-top:3px}
.h-invite{font-family:var(--ui);font-weight:400;font-size:23px;letter-spacing:.02em;color:var(--gold);margin:46px 0 0}
.guest-script{font-family:"Pinyon Script","WindSong",cursive;font-size:42px;color:var(--rose);margin:8px 0 2px;line-height:1.4;word-break:break-word;font-weight:500}
.lede{margin:0 auto;max-width:30ch;font-size:16.5px;font-weight:400;color:var(--gold)}
.names-big{margin:34px auto 6px;max-width:330px;line-height:1.05;text-align:center}
.names-big .n{display:block;font-size:44px;font-weight:300;color:var(--gold);letter-spacing:.01em}
.names-big .n.r{padding-left:70px}
.rg{display:inline-block;fill:none;stroke:currentColor;stroke-width:2.2}
.names-big .and{display:block;margin:6px 0 8px;transform:translateX(-22px)}
.names-big .and .rg{width:104px;height:61px}
.cover-names .a{margin:2px 0}
.cover-names .a .rg{width:80px;height:47px}
.when-lbl{margin:26px 0 12px;font-size:16px;font-weight:400}
.rule{height:2px;background:var(--line);width:84%;margin:0 auto}
.when{padding:16px 0 14px;color:var(--gold)}
.when .t{font-size:31px;font-weight:300;letter-spacing:.03em;text-transform:uppercase;line-height:1.3}
.when .d{font-size:33px;font-weight:300;letter-spacing:.04em;line-height:1.3}
.lunar{font-size:14.5px;color:var(--muted);font-style:italic;margin-top:4px}
.where-lbl{margin-top:26px;font-size:17px;font-weight:400}
.vtop{margin:0 auto 26px;padding:16px 12px 20px;max-width:360px;border:1.5px solid var(--gold);background:rgba(255,255,255,.75);position:relative;z-index:1}
.vtop{font-weight:700}
.vtop .k{font-family:var(--ui);font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase}
.vtop .v{font-size:26px;text-transform:uppercase;font-weight:800;line-height:1.2;margin:6px 0 4px}
.vtop .a{font-weight:700;font-size:16px;line-height:1.35}
.vtop .w{font-weight:700;font-size:15px;margin-top:6px;letter-spacing:.04em}
.venue{font-size:21px;text-transform:uppercase;color:var(--gold);font-weight:400;letter-spacing:.03em;margin:4px auto 2px;max-width:24ch;line-height:1.25}
.addr{margin:4px auto 0;max-width:32ch;color:var(--gold);font-size:14px;font-weight:400}
.dir{display:inline-flex;align-items:center;gap:8px;margin-top:10px;color:var(--gold);text-decoration:none;font-size:23px;font-weight:300;text-transform:uppercase;letter-spacing:.06em;padding:6px 10px}
.dir svg{width:32px;height:32px;fill:var(--gold)}
.invtxt{margin:30px auto 0;max-width:30ch;font-size:16.5px;font-weight:400}

/* ---------- timeline over photo ---------- */
.tl{padding:0;color:#fff;text-align:center;background:#4a3d30}
.tl-bg,.sd-bg,.ty-bg{position:absolute;inset:0}
.tl-bg img,.sd-bg img,.ty-bg img{width:100%;height:100%;object-fit:cover}
.tl-bg::after,.sd-bg::after,.ty-bg::after{content:"";position:absolute;inset:0;background:rgba(40,30,20,.5)}
.tl-in{position:relative;padding:60px 24px 56px}
.tl h2,.sd h2,.ty h2{font-family:var(--script);font-weight:400;color:#fff;margin:0;line-height:1.3}
.tl h2{font-size:clamp(30px,9.4vw,40px);white-space:nowrap}
.tl-ev{margin:30px auto 0;display:grid;justify-items:center;gap:6px}
.tl-ev svg{width:62px;height:62px;stroke:#fff;fill:none;stroke-width:1.6}
.tl-line{height:2px;background:#fff;width:100%;margin:8px 0 6px}
.tl-ev .tm{font-family:var(--ui);font-size:20px;font-weight:500;letter-spacing:.06em}
.tl-ev .ti{font-family:var(--ui);font-size:16px;font-weight:400}
.tl-ev .pl{font-family:var(--ui);font-size:14px;opacity:.92;max-width:30ch}
.cdk{margin-top:40px}
.cdk .lbl{font-family:var(--serif);font-size:26px;font-weight:300;letter-spacing:.05em}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px auto 0;max-width:330px}
.cd div{border:1px solid rgba(255,255,255,.75);padding:10px 0 6px;background:rgba(255,255,255,.1)}
.cd strong{display:block;font-size:30px;font-weight:300;line-height:1.1;font-variant-numeric:lining-nums tabular-nums}
.cd span{font-family:var(--ui);font-size:12px;letter-spacing:.12em;text-transform:uppercase}

/* ---------- couple ---------- */
.couple{text-align:center;overflow:hidden}
.couple>*:not(.wash){position:relative;z-index:1}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:26px}
.pc .fr{aspect-ratio:3/4;border:1px solid var(--gold-lt);padding:6px;background:var(--paper);box-shadow:0 6px 16px rgba(90,70,48,.12)}
.pc .fr img{width:100%;height:100%;object-fit:cover}
.pc .role{font-family:var(--script);color:var(--gold);font-size:36px;margin-top:8px;line-height:1.3}
.pc .who{font-size:20px;font-weight:400;color:var(--gold)}
.pc .sub{font-family:var(--ui);font-size:13px;color:var(--muted)}
.h2s{font-family:var(--script);color:var(--gold);font-size:clamp(34px,10.5vw,44px);white-space:nowrap;margin:0;line-height:1.3;font-weight:500}
.story{margin-top:26px}
.story p{margin:0 auto 14px;max-width:34ch;font-size:16px;font-weight:400}

/* ---------- save the date ---------- */
.sd{height:min(150vw,690px);padding:0;color:#fff;text-align:center;display:flex;align-items:flex-end;justify-content:center}
.sd-bg::after{background:linear-gradient(180deg,transparent 40%,rgba(30,22,14,.55))}
.sd-in{position:relative;padding:0 24px 54px}
.sd h2{font-size:clamp(40px,12.5vw,52px);white-space:nowrap}
.sd .nm{font-size:23px;font-weight:300;letter-spacing:.04em;margin-top:2px}
.sd .nm .rg{width:56px;height:33px;margin:0 6px;vertical-align:-8px}
.sd .dt{font-size:21px;font-weight:300;letter-spacing:.08em;margin-top:6px}

/* ---------- album ---------- */
.film{background:var(--gold);padding:7px 0;position:relative;overflow:hidden}
.film::before,.film::after{content:"";display:block;height:10px;margin:0 0 6px;background:repeating-linear-gradient(90deg,var(--cream) 0 13px,transparent 13px 24px)}
.film::after{margin:6px 0 0}
.film-track{display:flex;gap:7px;width:max-content;animation:roll 40s linear infinite}
.film-track img{width:72px;height:104px;object-fit:cover;object-position:50% 10%;border:3px solid #f1e8dc;background:#f1e8dc}
@keyframes roll{to{transform:translateX(-50%)}}
.alb{background:#fff;padding:34px 0 46px;position:relative;overflow:hidden}
.alb-row{display:flex;align-items:center;min-height:250px;position:relative}
.alb-title{width:42%;padding-left:22px}
.alb-title .the{font-family:var(--script);font-size:60px;color:var(--gold);line-height:1.1}
.alb-title .al{font-size:26px;font-weight:300;letter-spacing:.06em;color:var(--gold);text-transform:uppercase;margin-left:18px}
.alb-title .of{font-size:27px;font-weight:300;color:var(--gold);letter-spacing:.06em;text-transform:uppercase;line-height:1.25}
.tf{border:0;padding:0;cursor:pointer;background:var(--gold);box-shadow:0 8px 18px rgba(90,70,48,.25);display:block}
.tf img{width:100%;height:100%;object-fit:cover;object-position:50% 3%;border:5px solid var(--gold)}
.alb-row.f1{min-height:350px}
.tf.r1{position:absolute;right:-6px;top:0;width:58%;aspect-ratio:3/4;transform:rotate(5deg)}
.tf.l1{width:56%;aspect-ratio:1/1.05;transform:rotate(-4deg);margin:0 0 0 6px}
.alb-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px;padding:22px 18px 0}
.alb-grid .tf{width:100%;aspect-ratio:3/4}
.alb-grid .tf:nth-child(odd){transform:rotate(-2.5deg)}
.alb-grid .tf:nth-child(even){transform:rotate(2.5deg);margin-top:16px}
.alb-grid .tf.wide{grid-column:1/-1;aspect-ratio:3/2;transform:rotate(-1deg)}

/* ---------- rsvp ---------- */
.rsvp-sec{text-align:center}
.rsvp-sec p.s{margin:8px auto 0;max-width:34ch;font-size:16px;font-weight:400}
.rsvp{margin-top:22px;display:grid;gap:14px;text-align:left}
.rsvp label{display:grid;gap:5px;font-family:var(--ui);font-size:15px;color:var(--gold);font-weight:500}
.rsvp input,.rsvp select,.rsvp textarea{font:inherit;font-family:var(--serif);font-size:16px;font-weight:400;color:var(--ink);background:#fff;border:1px solid var(--line);padding:10px 12px;border-radius:2px;width:100%}
.rsvp textarea{min-height:84px;resize:vertical}
.rsvp input:focus,.rsvp select:focus,.rsvp textarea:focus{outline:2px solid var(--gold-lt);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:#a3392f;margin:0;text-align:center;font-size:16px}
.actions{display:grid;gap:10px;margin-top:4px}
.btn{font-family:var(--ui);font-size:17px;cursor:pointer;border:1px solid var(--gold);background:var(--gold);color:#fff;padding:12px 18px;border-radius:2px;text-decoration:none;text-align:center}
.btn.ghost{background:transparent;color:var(--gold)}
.btn.sm{font-size:14px;padding:8px 14px}
.btn:focus-visible,.dir:focus-visible,.tf:focus-visible,.env:focus-visible,.musicbtn:focus-visible{outline:3px solid var(--gold-lt);outline-offset:2px}
.thanks{margin-top:22px;padding:18px;border:1px dashed var(--gold-lt);background:#fff;text-align:center}
.thanks pre{white-space:pre-wrap;font:inherit;text-align:left;background:var(--cream);padding:12px;margin:12px 0;font-size:16px}
.gift{margin-top:22px;display:grid;gap:14px}
.bank{display:flex;gap:14px;align-items:center;justify-content:space-between;text-align:left;padding:16px;border:1px solid var(--line);background:#fff}
.bank .cap{font-family:var(--ui);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.bank .num{font-size:22px;font-weight:400;color:var(--gold);letter-spacing:.04em;margin:2px 0 8px}
.bank .qr{width:112px;height:112px;object-fit:contain;flex:none;background:#fff}
[hidden]{display:none!important}

/* ---------- thank you ---------- */
.ty{height:min(150vw,690px);padding:0;color:#fff;text-align:center;display:flex;align-items:flex-end;justify-content:center}
.ty-in{position:relative;padding:0 24px 48px}
.ty h2{font-size:clamp(46px,15vw,62px);white-space:nowrap}
.ty p{margin:6px auto 0;max-width:26ch;font-size:17px;font-weight:300}
.foot{padding:20px;text-align:center;font-family:var(--ui);font-size:13px;color:var(--muted);background:#fff}

/* ---------- misc ---------- */
.musicbtn{position:fixed;z-index:60;left:max(14px,calc(50vw - 230px + 14px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:50px;height:50px;border-radius:50%;border:2px solid var(--gold);background:rgba(255,255,255,.96);color:var(--gold);cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.musicbtn svg{width:22px;height:22px}
.musicbtn.on svg{animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* ---------- hiệu ứng ---------- */
.petals{position:fixed;inset:0;pointer-events:none;z-index:130;overflow:hidden}
.petals i{position:absolute;top:-30px;width:14px;height:18px;background:radial-gradient(circle at 30% 30%,#F8DDE1,#E4A9B3);border-radius:70% 0 70% 0;opacity:0;animation:fall linear infinite;will-change:transform}
@keyframes fall{0%{transform:translate3d(0,-30px,0) rotate(0);opacity:0}8%{opacity:.85}100%{transform:translate3d(var(--dx),108vh,0) rotate(var(--rot));opacity:.7}}
.glow{position:fixed;left:50%;top:50%;width:40px;height:40px;margin:-20px;border-radius:50%;pointer-events:none;z-index:101;background:radial-gradient(circle,rgba(255,236,200,.95),rgba(255,220,170,0) 70%);animation:glow 1.3s ease-out forwards}
@keyframes glow{from{transform:scale(.4);opacity:1}to{transform:scale(16);opacity:0}}
.intro>*{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i)*.14s + .15s)}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.kb{transform:scale(1.12);transition:transform 9s ease-out}
.reveal:not(.pre) .kb{transform:scale(1)}
.pc{transition:opacity 1s ease,transform 1s ease}
.reveal.pre .pc:first-child{opacity:0;transform:translateX(-36px)}
.reveal.pre .pc:last-child{opacity:0;transform:translateX(36px)}
.alb .tf{transition:opacity .8s ease,filter .8s ease}
.reveal.pre .tf{opacity:0}
.reveal.pre .rg{transform:scale(.6) rotate(-8deg);opacity:0}
.rg{transition:transform 1s ease .3s,opacity 1s ease .3s}
.reveal{transition:opacity .9s ease,transform .9s ease}
.reveal.pre{opacity:0;transform:translateY(24px)}
.lightbox{position:fixed;inset:0;z-index:200;background:rgba(20,14,8,.94);display:grid;place-items:center}
.lightbox img{max-width:94vw;max-height:84vh;object-fit:contain}
.lb-btn{position:absolute;background:rgba(255,255,255,.14);color:#fff;border:0;width:46px;height:46px;border-radius:50%;font-size:26px;cursor:pointer}
.lb-close{top:16px;right:16px}.lb-prev{left:12px;top:50%}.lb-next{right:12px;top:50%}
.lb-ct{position:absolute;bottom:20px;color:#fff;font-size:15px;background:rgba(0,0,0,.55);padding:3px 14px;border-radius:99px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style></head>

    <div class="sd-in"><h2>Save the date</h2><div class="nm">${esc(g.short)}<svg class="rg" viewBox="0 0 120 70" aria-label="và" role="img"><use href="#rings"/></svg>${esc(b.short)}</div><div class="dt">${dotDate}</div></div>
  </section>

  <div class="film" aria-hidden="true"><div class="film-track">${album.concat(album).map(u => `<img src="${u}" alt="" loading="lazy">`).join('')}</div></div>
  <section class="alb reveal">
    <div class="alb-row f1">
      <div class="alb-title"><div class="the">The</div><div class="al">Album</div></div>
      <button class="tf r1" type="button" data-lb="0" aria-label="Xem ảnh 1"><img src="${album[0]}" alt="" loading="lazy"></button>
    </div>
    <div class="alb-row" style="margin-top:14px;min-height:230px">
      <button class="tf l1" type="button" data-lb="1" aria-label="Xem ảnh 2"><img src="${album[1]}" alt="" loading="lazy"></button>
      <div class="alb-title" style="padding-left:28px"><div class="of">Of<br>Love</div></div>
    </div>
    <div class="alb-grid">${album.slice(2).map((u,i) => `<button class="tf${wide.has(i+2)?' wide':''}" type="button" data-lb="${i+2}" aria-label="Xem ảnh ${i+3}"><img src="${u}" alt="" loading="lazy"></button>`).join('')}</div>
  </section>

  ${noRsvp ? `<section class="sec rsvp-sec reveal">
    <h2 class="h2s">Mừng cưới</h2>
    ${banks.length ? `<div class="actions"><button class="btn ghost" type="button" data-act="gift">Gửi quà mừng cưới</button></div>` : ''}
    <div class="gift" id="gift" hidden>
      ${banks.map(k => `<div class="bank"><div><div class="cap">${esc(k.who)}</div><div>${esc(k.bank)} · ${esc(k.name)}</div><div class="num">${esc(k.number)}</div><button class="btn ghost sm" type="button" data-copy="${esc(k.number)}">Sao chép số tài khoản</button></div><img class="qr" src="${esc(k.qr)}" alt="Mã QR chuyển khoản" loading="lazy"></div>`).join('')}
    </div>
  </section>` : `  <section class="sec rsvp-sec reveal">
    <h2 class="h2s">Xác nhận tham dự</h2>
    <p class="s">Hãy cho chúng mình biết bạn có đến được không để chuẩn bị đón tiếp chu đáo nhất nhé.</p>
    <form class="rsvp" id="rsvpForm" novalidate>
      <label for="r-name">Tên của bạn là gì?<input id="r-name" name="name" autocomplete="name" placeholder="Ví dụ: Anh Tuấn" value="${esc(guest)}"></label>
      <label for="r-wish">Gửi lời chúc cho cô dâu chú rể<textarea id="r-wish" name="wish" placeholder="Chúc hai bạn trăm năm hạnh phúc!"></textarea></label>
      <div class="row2">
        <label for="r-go">Bạn sẽ đến chứ?<select id="r-go" name="go"><option>Chắc chắn rồi</option><option>Có thể</option><option>Tiếc quá, không đến được</option></select></label>
        <label for="r-count">Đi cùng mấy người?<select id="r-count" name="count"><option>Đi một mình</option><option>2 người</option><option>3 người</option><option>4 người trở lên</option></select></label>
      </div>
      <label for="r-side">Bạn là khách mời của ai?<select id="r-side" name="side"><option selected>Khách của chú rể</option><option>Khách của cô dâu</option><option>Khách của cả hai</option></select></label>
      <p id="r-err" class="err" hidden>Bạn nhập tên giúp chúng mình nhé.</p>
      <div class="actions">
        <button class="btn" type="submit">Gửi lời chúc &amp; xác nhận</button>
        ${banks.length ? `<button class="btn ghost" type="button" data-act="gift">Gửi quà mừng cưới</button>` : ''}
      </div>
    </form>
    <div class="thanks" id="thanks" hidden>
      <div class="h2s" style="font-size:42px">Cảm ơn bạn!</div>
      <div>Bạn sao chép lời nhắn dưới đây và gửi qua Zalo cho chúng mình nhé:</div>
      <pre id="thanksMsg"></pre>
      <div class="actions"><button class="btn" type="button" data-act="copymsg">Sao chép lời nhắn</button></div>
      <p style="margin:12px 0 0;font-size:16px">Zalo chú rể: <b>${esc(S.phones.groom)}</b> · Zalo cô dâu: <b>${esc(S.phones.bride)}</b></p>
    </div>
    <div class="gift" id="gift" hidden>
      ${banks.map(k => `<div class="bank"><div><div class="cap">${esc(k.who)}</div><div>${esc(k.bank)} · ${esc(k.name)}</div><div class="num">${esc(k.number)}</div><button class="btn ghost sm" type="button" data-copy="${esc(k.number)}">Sao chép số tài khoản</button></div><img class="qr" src="${esc(k.qr)}" alt="Mã QR chuyển khoản" loading="lazy"></div>`).join('')}
    </div>
  </section>`}

  <section class="sec ty">
    <div class="ty-bg"><img class="kb" src="${ph.thanks}" alt="" loading="lazy"></div>
    <div class="ty-in"><h2>Thank you !</h2><p>${esc(S.closing)}</p></div>
  </section>
  <footer class="foot">${esc(g.short)} &amp; ${esc(b.short)} · ${dotDate}</footer>
</main>
<button class="musicbtn" type="button" data-act="music" aria-label="Bật/tắt nhạc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="6" cy="18" r="3" fill="currentColor"/><circle cx="17" cy="16" r="3" fill="currentColor"/></svg></button>`;
}

/* ---- runtime ---- */
function startCountdown(){
  const target = new Date(`${S.date}T${S.time}:00+07:00`), last = {};
  const tick = () => {
    let t = Math.max(0, Math.floor((target - Date.now())/1000)); if (isNaN(t)) t = 0;
    const v = {d:Math.floor(t/86400), h:pad(Math.floor(t%86400/3600)), m:pad(Math.floor(t%3600/60)), s:pad(t%60)};
    for (const k in v){ if (last[k] === v[k]) continue; const el = app.querySelector(`[data-cd="${k}"]`); if (el){ el.textContent = v[k]; last[k] = v[k]; } }
  };
  tick(); setInterval(tick, 1000);
}
let audio = null;
const musicBtn = () => $('.musicbtn');
function playMusic(){ try { if(!audio){ audio = new Audio(S.music); audio.loop = true; } const pr = audio.play(); if (pr && pr.then) pr.then(() => musicBtn()?.classList.add('on')).catch(()=>{}); } catch(e){} }
function toggleMusic(){ if (audio && !audio.paused){ audio.pause(); musicBtn()?.classList.remove('on'); } else playMusic(); }
function petals(n, burst){
  if (reduce) return;
  const box = document.createElement('div'); box.className = 'petals'; box.setAttribute('aria-hidden','true');
  for (let k = 0; k < n; k++){
    const e = document.createElement('i'), sz = 9 + Math.random()*10;
    e.style.cssText = `left:${Math.random()*100}%;width:${sz}px;height:${sz*1.3}px;--dx:${(Math.random()*160-80).toFixed(0)}px;--rot:${(Math.random()*720-360).toFixed(0)}deg;animation-duration:${(7+Math.random()*7).toFixed(1)}s;animation-delay:${(burst ? Math.random()*1.6 : Math.random()*12).toFixed(1)}s`;
    box.appendChild(e);
  }
  document.body.appendChild(box);
}
function introCard(){
  const inv = app.querySelector('.inv'); if (!inv || reduce) return;
  [...inv.children].filter(c => !c.classList.contains('flora') && !c.classList.contains('wash')).forEach((c,i) => c.style.setProperty('--i', i));
  inv.classList.add('intro');
}
function setupReveal(){
  if (reduce || !('IntersectionObserver' in window)) return;
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.remove('pre'); io.unobserve(e.target); } }), {rootMargin:'0px 0px -8% 0px'});
  app.querySelectorAll('.reveal').forEach(el => { if (el.getBoundingClientRect().top > innerHeight){ el.classList.add('pre'); io.observe(el); } });
}
function showCover(){
  const wrap = document.createElement('div'); wrap.innerHTML = coverHTML();
  const cover = wrap.firstElementChild; document.body.appendChild(cover);
  document.body.classList.add('lock');
  let opened = false;
  const open = () => {
    if (opened) return; opened = true;
    cover.classList.add('opening'); playMusic();
    if (!reduce){ const gl = document.createElement('div'); gl.className = 'glow'; cover.appendChild(gl); petals(26, true); }
    setTimeout(() => cover.classList.add('fade'), reduce ? 0 : 1500);
    setTimeout(() => { cover.remove(); document.body.classList.remove('lock'); window.scrollTo(0,0); introCard(); petals(12, false); }, reduce ? 50 : 2500);
  };
  $('#envBtn', cover).addEventListener('click', open);
}
async function copyText(text, btn){
  const old = btn.textContent;
  try { await navigator.clipboard.writeText(text); btn.textContent = 'Đã sao chép'; } catch { btn.textContent = 'Hãy bôi đen để sao chép'; }
  setTimeout(() => btn.textContent = old, 1800);
}
app.addEventListener('submit', e => {
  if (e.target.id !== 'rsvpForm') return;
  e.preventDefault();
  const f = new FormData(e.target), name = String(f.get('name')||'').trim();
  $('#r-err').hidden = !!name; if (!name){ $('#r-name').focus(); return; }
  const wish = String(f.get('wish')||'').trim();
  const msg = `Xác nhận dự cưới ${g.short} & ${b.short} (${pad(p.da)}/${pad(p.mo)}/${p.y})\n• Tên: ${name}\n• Tham dự: ${f.get('go')} (${f.get('count')})\n• ${f.get('side')}` + (wish ? `\n• Lời chúc: ${wish}` : '');
  $('#thanksMsg').textContent = msg; $('#thanks').hidden = false;
  $('#thanks').scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block:'center'});
});
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-copy],[data-lb]'); if (!t) return;
  if (t.dataset.copy) return copyText(t.dataset.copy, t);
  if (t.dataset.lb != null) return openLightbox(+t.dataset.lb);
  const a = t.dataset.act;
  if (a === 'gift'){ const gf = $('#gift'); gf.hidden = !gf.hidden; if (!gf.hidden) gf.scrollIntoView({behavior: reduce?'auto':'smooth', block:'nearest'}); }
  if (a === 'copymsg') copyText($('#thanksMsg').textContent, t);
  if (a === 'music') toggleMusic();
});
function openLightbox(i){
  const list = S.album;
  const lb = document.createElement('div'); lb.className = 'lightbox'; lb.setAttribute('role','dialog'); lb.setAttribute('aria-label','Xem ảnh');
  lb.innerHTML = `<img alt=""><div class="lb-ct"></div><button class="lb-btn lb-close" aria-label="Đóng">✕</button><button class="lb-btn lb-prev" aria-label="Ảnh trước">‹</button><button class="lb-btn lb-next" aria-label="Ảnh sau">›</button>`;
  const im = $('img', lb), ct = $('.lb-ct', lb);
  const show = () => { const x = (i % list.length + list.length) % list.length; im.src = list[x]; ct.textContent = (x+1) + ' / ' + list.length; };
  const close = () => { lb.remove(); removeEventListener('keydown', key); };
  const key = e => { if (e.key==='Escape') close(); if (e.key==='ArrowRight'){ i++; show(); } if (e.key==='ArrowLeft'){ i--; show(); } };
  show(); document.body.appendChild(lb); $('.lb-close', lb).focus(); addEventListener('keydown', key);
  lb.addEventListener('click', e => { if (e.target.closest('.lb-prev')){ i--; show(); } else if (e.target.closest('.lb-next')){ i++; show(); } else if (e.target === lb || e.target.closest('.lb-close')) close(); });
  let sx = 0;
  lb.addEventListener('touchstart', e => { sx = e.changedTouches[0].clientX; }, {passive:true});
  lb.addEventListener('touchend', e => { const d = e.changedTouches[0].clientX - sx; if (d > 45){ i--; show(); } else if (d < -45){ i++; show(); } }, {passive:true});
}

app.innerHTML = cardHTML();
startCountdown(); setupReveal(); showCover();
})();
</script>
</body></html>
